name: Test & Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: GlazeAndGrind

jobs:
  test:
    name: Unit tests + simulation
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --editor --quit --path . || true
      - name: Unit tests
        run: godot --headless --path . -s tests/run_tests.gd
      - name: 3-day gameplay simulation
        run: |
          godot --headless --fixed-fps 60 --path . -s tests/smoke_sim.gd | tee sim.log
          grep -q "SMOKE OK" sim.log
          ! grep -q "SCRIPT ERROR" sim.log

  export:
    name: Export ${{ matrix.preset }}
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Linux"
            dir: linux
            file: GlazeAndGrind.x86_64
          - preset: "Windows Desktop"
            dir: windows
            file: GlazeAndGrind.exe
          - preset: "Web"
            dir: web
            file: index.html
          - preset: "Android"
            dir: android
            file: GlazeAndGrind.apk
    steps:
      - uses: actions/checkout@v4
      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Set up Android signing (debug keystore)
        if: matrix.dir == 'android'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import
        run: godot --headless --editor --quit --path . || true
      - name: Export
        run: |
          mkdir -v -p builds/${{ matrix.dir }}
          godot --headless --path . --export-release "${{ matrix.preset }}" builds/${{ matrix.dir }}/${{ matrix.file }}
          ls -la builds/${{ matrix.dir }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-${{ matrix.dir }}
          path: builds/${{ matrix.dir }}

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip builds
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || startsWith(github.ref, 'refs/tags/v0.') }}
          generate_release_notes: true
