server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types application/wasm application/javascript text/css application/octet-stream;
    location / { try_files $uri $uri/ /index.html; }
}
